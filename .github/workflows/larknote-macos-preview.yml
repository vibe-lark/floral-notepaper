name: LarkNote Mac Preview

# Run only on demand, in an explicitly authorized repository. This workflow
# uploads build artifacts; it never creates a public release or tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Mac preview (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      FLORAL_NOTEPAPER_CONFIG_DIR: ${{ runner.temp }}/larknote-config
      FLORAL_NOTEPAPER_DATA_DIR: ${{ runner.temp }}/larknote-data
      FLORAL_NOTEPAPER_TEST_TEMP_DIR: ${{ runner.temp }}/larknote-tests
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
      - name: Install dependencies
        run: npm ci
      - name: Frontend and packaging tests
        run: npm test
      - name: Compile and test native integration
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib -- --test-threads=1
      - name: Build and verify Mac installer
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: npm run build:mac -- --target "$BUILD_TARGET"
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: LarkNote-${{ matrix.target }}-${{ github.sha }}
          path: local-build/macos/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 14
