[package]
name = "larknote-sync-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
dirs = "6"
trash = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
